name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift toolchain
        run: swift --version

      - name: Run integration tests
        run: scripts/test.sh

      - name: Build universal app archive
        run: scripts/package-app.sh

      - name: Verify packaged app
        run: |
          rm -rf .build/package-check
          mkdir -p .build/package-check
          ditto -x -k .build/dist/Prune-macOS.zip .build/package-check
          codesign --verify --deep --strict .build/package-check/Prune.app
          plutil -lint .build/package-check/Prune.app/Contents/Info.plist
          ARCHS="$(lipo -archs .build/package-check/Prune.app/Contents/MacOS/Prune)"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]

      - name: Upload downloadable build
        uses: actions/upload-artifact@v7
        with:
          name: Prune-macOS
          path: |
            .build/dist/Prune-macOS.zip
            .build/dist/Prune-macOS.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged app
        uses: actions/download-artifact@v8
        with:
          name: Prune-macOS
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Prune-macOS.zip \
            dist/Prune-macOS.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Prune $GITHUB_REF_NAME"
